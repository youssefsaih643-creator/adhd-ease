const dk=d=>{const x=new Date(d);return x.getFullYear()+'-'+x.getMonth()+'-'+x.getDate()};

function impText(tx){let o;try{o=JSON.parse(tx)}catch(e){return toast('That is not valid backup data.')}if(!o||!Array.isArray(o.tasks))return toast('That file is not an ADHD Ease backup.');S=clean(o);draft={};persist();log('Imported data');persist();toast('Imported '+S.tasks.length+' task'+(S.tasks.length===1?'':'s'));render()}
const tuv=()=>{const d=$('#tmd'),b=$('#tmb'),m=$('#tmm');if(d)d.textContent=fmt(tl||tmin*60);if(b)b.textContent=tint?'Pause':'Start timer';if(m)m.textContent=tdone?'Time is up. Stop here, or keep going if you want. Your choice.':'Use it only if it helps.'};
const A={
async signin(){if(!sb||au.busy)return;au.busy=true;au.err='';render(true);try{const r=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname,queryParams:{prompt:'select_account'}}});if(r.error)throw r.error}catch(e){au.busy=false;au.err='Could not start Google sign-in. '+aMsg(e);render(true)}},
async signout(){if(!sb||au.busy)return;au.busy=true;au.err='';render(true);try{if(cl.ready&&cl.tm)await cloudFlush();const r=await sb.auth.signOut({scope:'local'});if(r.error)throw r.error;au.user=null;toast('Signed out. Your planner data on this device was not changed.')}catch(e){au.err='Could not sign out. '+aMsg(e)}au.busy=false;render(true)},
syncretry(){if(cl.uid&&cl.ready){cl.fails=0;cloudFlush()}else if(au.user)cloudLoad(au.user.id)},
new(){S.cur=null;draft={};stp=1;go('steps')},stp(b){stp=+b.dataset.n;go('steps')},pg(b){pg=+b.dataset.n;render()},
s1(){const t=cur(),d=t||draft;if(!(d.title||'').trim())return toast('Describe your task first.');if(!t){const n=mk(d);S.tasks.unshift(n);S.cur=n.id;log('Created task: '+n.title)}else log('Updated task: '+t.title);bump(cur(),2);return sv()},
qadd(){const v=$('#qt').value.trim();if(!v)return toast('Type a task first.');const n=mk({title:v});S.tasks.unshift(n);S.cur=n.id;bump(n,2);log('Created task: '+v);sv('Task added')},
pick(b){S.cur=b.dataset.i;persist();render(true)},
s2(){const t=cur();S.tasks.forEach(x=>{if(x.prio==='Top priority'&&x!==t)x.prio='Normal'});t.prio='Top priority';bump(t,3);log('Chose priority: '+t.title);return sv()},
add(){const v=$('#na').value.trim();if(!v)return toast('Type an action first.');cur().actions.push({id:uid(),t:v,done:false});sv('Action added')},
del(b){const t=cur();t.actions=t.actions.filter(a=>a.id!==b.dataset.i);sv('Action removed')},
mv(b){const L=cur().actions,i=L.findIndex(a=>a.id===b.dataset.i),j=i+ +b.dataset.d;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];persist();render(true)},
tog(b){const t=cur(),a=t.actions.find(x=>x.id===b.dataset.i);a.done=!a.done;if(a.done){log('Completed: '+a.t);if(t.status==='Not started')t.status='In progress'}persist();render(true)},
ex(){cur().actions=['Remove unnecessary items.','Put dishes in the sink.','Wipe the counter.','Return essential items.','Check the finished area.'].map(t=>({id:uid(),t,done:false}));sv('Example actions added. Edit them freely.')},
s3(){const t=cur();if(!t.actions.length)return toast('Add at least one action.');bump(t,4);log('Broke down: '+t.title);return sv()},
start(){const t=cur(),a=t.actions.find(x=>x.id===t.first);if(!a)return toast('Choose your first action.');t.status='In progress';bump(t,5);log('Started: '+a.t);return sv('Begin with: '+a.t)},
tm(b){tOpen=true;tmin=+b.dataset.m;tl=tmin*60;tdone=false;if(tint){clearInterval(tint);tint=null}render(true)},
tgo(){tOpen=true;if(tint){clearInterval(tint);tint=null;return tuv()}if(tl<=0){tl=tmin*60;tdone=false}tint=setInterval(()=>{tl--;if(tl<=0){clearInterval(tint);tint=null;tl=0;tdone=true;log('Finished a '+tmin+' minute focus timer');persist();toast('Time is up.')}tuv()},1000);tuv()},
trs(){tOpen=true;clearInterval(tint);tint=null;tl=0;tdone=false;render(true)},
s5(){const t=cur();bump(t,5);log('Reviewed: '+t.title);return sv('Review saved')},
fin(){const t=cur();t.status='Completed';t.stage=5;log('Completed task: '+t.title);sv('Task marked complete')},
reopen(b){S.cur=b.dataset.i;pg=1;go('planner')},
askdel(b){delId=b.dataset.i;render(true)},cancel(){delId=null;wipeAsk=false;render(true)},
deltask(b){const t=S.tasks.find(x=>x.id===b.dataset.i);S.tasks=S.tasks.filter(x=>x.id!==b.dataset.i);if(S.cur===b.dataset.i)S.cur=null;delId=null;if(t)log('Deleted task: '+t.title);sv('Task deleted')},
aplay(){if(!canPlay())return;if(aSt==='paused'){aEl?aEl.play():speechSynthesis.resume();aSt='playing';aupd()}else if(aSt!=='playing')speak(aSt==='done'?0:aIdx)},
apause(){if(aSt==='playing'){aEl?aEl.pause():speechSynthesis.pause();aSt='paused';aupd()}},
astop(){if(!canPlay())return;stopAll();aSt='idle';aIdx=0;aupd()},arestart(){speak(0)},asec(b){speak(+b.dataset.i)},
aprev(){speak(Math.max(0,aIdx-1))},anext(){speak(Math.min(SC.length-1,aIdx+1))},dismiss(){recovered=false;render(true)},
removephoto(){S.profilePic='';log('Removed profile photo');persist();toast('Profile photo removed');render(true)},
exp(){const j=JSON.stringify({app:'ADHD Ease',version:3,exportedAt:new Date().toISOString(),...S},null,2);$('#dj').value=j;try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download='adhd-ease-data.json';document.body.appendChild(a);a.click();a.remove()}catch(e){}toast('Exported. Copy the text from the box if no file downloaded.')},
imp(){const v=$('#dj').value.trim();if(!v)return toast('Paste backup data into the box first.');impText(v)},
askwipe(){wipeAsk=true;render(true)},wipe(){S={tasks:[],cur:null,log:[],name:'',profilePic:''};draft={};wipeAsk=false;persist();toast('All saved data deleted');render()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a],[data-go]');if(!b)return;if(b.dataset.go){if(b.dataset.stp)stp=+b.dataset.stp;if(b.dataset.pg)pg=+b.dataset.pg;go(b.dataset.go);return}
const ok=A[b.dataset.a](b);if(ok&&b.dataset.nx){stp=+b.dataset.nx;go('steps')}});
render();if(TTS)loadVoices();if(sb)authInit();addEventListener('pageshow',e=>{if(e.persisted&&au.busy){au.busy=false;render(true)}});
</script></body></html>
