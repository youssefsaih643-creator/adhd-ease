<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ADHD Ease</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600;6..96,700&family=Cormorant+Garamond:wght@400&display=swap" rel="stylesheet">
<style>
:root{--p:#A78BFA;--pd:#6D4FD6;--pale:#F4F0FF;--tx:#1F1F29;--mu:#77717F;--bd:#EAE6F0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:#fff;color:var(--tx);font-family:'Cormorant Garamond',serif;font-weight:400;font-size:19px;line-height:1.6;overflow-x:hidden}
h1,h2{font-family:'Bodoni Moda',serif;font-weight:700;margin:0;line-height:1.2;letter-spacing:.005em}

h1{font-size:34px}h2{font-size:24px}h3{font-size:19px}h4{font-size:16px}
p{margin:0 0 10px;max-width:64ch}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--p);outline-offset:2px}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:28px 16px;border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:28px}

.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;gap:12px;align-items:center;border:0;background:none;padding:10px 14px;border-radius:12px;color:var(--mu);font-size:20px;text-align:left}
.nav button:hover{background:var(--pale)}.nav button[aria-current=page]{background:var(--pale);color:var(--tx);box-shadow:inset 3px 0 0 var(--p)}
svg.i{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sf{margin-top:auto;border-top:1px solid var(--bd);padding:14px 10px 0;font-size:16px;color:var(--mu);line-height:1.4}
main{padding:40px 48px 70px;max-width:1080px;width:100%}
.top{margin-bottom:28px;padding-bottom:18px;border-bottom:1px solid var(--bd)}.top p{color:var(--mu);font-size:21px;margin:6px 0 0}
.btn{border:0;background:var(--p);color:var(--tx);padding:10px 22px;border-radius:999px;font:600 14px 'Bodoni Moda',serif;letter-spacing:.02em}
.btn:hover{background:#9778F5}.btn.o{background:#fff;border:1.5px solid var(--p)}.btn.o:hover{background:var(--pale)}.btn.sm{padding:6px 14px;font-size:13px}.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:26px;box-shadow:0 2px 10px rgba(167,139,250,.08)}.pale{background:var(--pale);border-color:#E6DEFB}
.g{display:grid;gap:22px}.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.mu{color:var(--mu)}.tag{display:inline-block;background:#fff;border:1px solid #D9CCFA;color:var(--pd);border-radius:99px;padding:0 12px;font-size:16px}
.sec{margin-top:40px}.sec>h2{margin-bottom:6px}.lead{font-size:21px;color:var(--mu)}
.sc{text-align:left;border:1px solid var(--bd);background:#fff;border-radius:14px;padding:18px;display:block;width:100%}.sc:hover,.sc.on{border-color:var(--p);background:var(--pale)}
.sc b{font:700 30px 'Bodoni Moda',serif;color:var(--p);display:block;line-height:1}.sc h4{margin:10px 0 6px}.sc p{font-size:18px;color:var(--mu);line-height:1.4;margin:0}
.sc.done b::after{content:" ✓";font-size:16px;color:var(--pd)}
.bar{height:8px;border-radius:99px;background:#E6DEFB;overflow:hidden}.bar i{display:block;height:100%;background:var(--p)}
.paper{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:14px;box-shadow:0 8px 24px rgba(167,139,250,.18);font-size:13px;line-height:1.3}
.paper h5{font:600 11px 'Bodoni Moda',serif;margin:0 0 8px;color:var(--pd)}.paper u{display:block;height:6px;border-radius:3px;background:#EEE9FB;margin:7px 0;text-decoration:none}
.paper s{display:flex;gap:6px;align-items:center;margin:6px 0;text-decoration:none}.paper s::before{content:"";width:10px;height:10px;border:1.5px solid var(--p);border-radius:3px}.paper s::after{content:"";height:5px;flex:1;background:#EEE9FB;border-radius:3px}
.prev{position:relative;height:250px}.prev .paper{position:absolute;width:48%}
.prev .a{left:0;top:30px;transform:rotate(-4deg)}.prev .b{left:26%;top:0;z-index:2}.prev .c{right:0;top:40px;transform:rotate(4deg)}
.eg{border-left:3px solid var(--p);background:var(--pale);padding:10px 16px;border-radius:0 10px 10px 0;margin:14px 0;font-size:18px}.eg b{font:600 14px 'Bodoni Moda',serif;color:var(--pd)}
.f{display:block;margin-bottom:16px}.f>span{display:block;font:600 15px 'Bodoni Moda',serif;margin-bottom:5px}
.f input,.f textarea,.f select,.inp{width:100%;border:1.5px solid var(--bd);border-radius:10px;padding:9px 13px;background:#fff;font-size:19px}
.f input:focus,.f textarea:focus,.f select:focus,.inp:focus{border-color:var(--p);outline:0;box-shadow:0 0 0 3px #E6DEFB}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.act{display:flex;gap:8px;align-items:center;margin-bottom:8px}.act input[type=text]{flex:1;min-width:0;border:1.5px solid var(--bd);border-radius:10px;padding:7px 12px;font-size:19px}
.act.d input[type=text]{text-decoration:line-through;color:var(--mu)}
.ck{width:28px;height:28px;border-radius:8px;border:2px solid var(--p);background:#fff;flex:none;color:#fff;line-height:1}.ck.on{background:var(--p)}
.x{border:0;background:none;color:var(--mu);font-size:20px;padding:2px 6px}.x:hover{color:var(--tx)}
.st{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}.st button{flex:1;min-width:100px;border:1px solid var(--bd);background:#fff;border-radius:12px;padding:8px 6px;font-size:15px;line-height:1.2}
.st button.on{background:var(--pale);border-color:var(--p)}.st b{display:block;font:700 20px 'Bodoni Moda',serif;color:var(--p)}
.pick{display:flex;gap:12px;align-items:center;border:1.5px solid var(--bd);border-radius:12px;padding:10px 14px;margin-bottom:8px;width:100%;background:#fff;text-align:left}
.pick.on{border-color:var(--p);background:var(--pale)}.pick i{width:18px;height:18px;border-radius:50%;border:2px solid var(--p);flex:none}.pick.on i{background:var(--p);box-shadow:inset 0 0 0 3px #fff}
.nav2{display:flex;justify-content:space-between;margin-top:28px;padding-top:18px;border-top:1px solid var(--bd)}
.stat b{display:block;font:700 36px 'Bodoni Moda',serif;color:var(--pd);line-height:1.1}.stat span{color:var(--mu)}
.hist{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.hist:last-child{border:0}
.empty{text-align:center;padding:26px;color:var(--mu);background:var(--pale);border-radius:14px}.empty p{margin:0 auto 10px}
.pg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}.pg button{border:1px solid var(--bd);background:#fff;border-radius:99px;padding:3px 14px;font-size:16px}.pg button.on{background:var(--p);border-color:var(--p)}
.folio{font:600 13px 'Bodoni Moda',serif;color:var(--pd);margin-bottom:4px}
.cover{width:180px;height:180px;border-radius:20px;background:var(--pale);border:1px solid #E6DEFB;position:relative;flex:none;overflow:hidden}
.cover::before,.cover::after{content:"";position:absolute;border:1.5px solid var(--p);border-radius:50%}.cover::before{inset:24px}.cover::after{inset:58px;background:var(--p)}
.cover b{position:absolute;left:0;right:0;bottom:10px;text-align:center;font:600 12px 'Bodoni Moda',serif;color:var(--pd)}
.pl{width:52px;height:52px;border-radius:50%;border:0;background:var(--p);display:grid;place-items:center;flex:none}.pl svg{width:20px;height:20px;fill:var(--tx)}
input[type=range]{width:100%;accent-color:var(--p)}
.tr{display:grid;grid-template-columns:34px 1fr;gap:4px 14px;padding:14px 0;border-bottom:1px solid var(--bd)}.tr:last-child{border:0}.tr>b{font:700 24px 'Bodoni Moda',serif;color:var(--p);grid-row:span 3;line-height:1.1}.tr h4{margin:0}.tr p{margin:0}
.flow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:14px 0}.flow span{background:var(--pale);border:1px solid #E6DEFB;border-radius:99px;padding:2px 14px;font-size:16px}.flow em{color:var(--p);font-style:normal}
.gap{display:flex;align-items:center;gap:10px;margin:14px 0;flex-wrap:wrap}.gap span{border:1px solid var(--bd);border-radius:10px;padding:6px 14px}.gap i{flex:1;min-width:60px;border-top:2px dashed var(--p);position:relative;text-align:center;height:0}.gap i::after{content:"the gap";position:absolute;left:50%;transform:translate(-50%,-125%);font-size:14px;color:var(--mu);font-style:normal;white-space:nowrap}
.gd{border-bottom:1px solid var(--bd);padding:22px 0}.gd:last-child{border:0}.gd h3{margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;border:1.5px solid var(--p);color:var(--tx);padding:8px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;box-shadow:0 6px 20px rgba(167,139,250,.3);max-width:90vw}#toast.s{opacity:1}
.tabs{display:none}.mh{display:none}
@media(max-width:1000px){.g5{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{display:none}
.mh{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd);font:700 19px 'Bodoni Moda',serif}
main{padding:22px 16px 110px}h1{font-size:28px}.g2,.g5{grid-template-columns:1fr}.card{padding:20px}.prev{height:210px}.cv{flex-direction:column;align-items:flex-start}
.tabs{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);padding:5px 0 calc(5px + env(safe-area-inset-bottom,0px));z-index:20}
.tabs button{flex:1;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:11px;line-height:1.2;color:var(--mu);padding:4px 0;border-radius:10px}.tabs button[aria-current=page]{color:var(--pd);background:var(--pale)}#toast{bottom:100px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.tr.cur{background:var(--pale);border-radius:12px;padding:14px;border-bottom-color:transparent}.btn:disabled{opacity:.45}@media(max-width:820px){.btn{min-height:44px}.x{min-width:42px;min-height:42px}.ck{width:34px;height:34px}.act{gap:6px}.pg button{padding:8px 14px}}</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></symbol><symbol id="steps" viewBox="0 0 24 24"><path d="M4 19h5v-5h5V9h6"/></symbol>
<symbol id="planner" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></symbol><symbol id="audio" viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0116 0v2M4 14h3v5H4zM17 14h3v5h-3z"/></symbol>
<symbol id="guide" viewBox="0 0 24 24"><path d="M5 4h10a4 4 0 014 4v12H9a4 4 0 01-4-4zM5 16a4 4 0 014-4h10"/></symbol><symbol id="progress" viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></symbol>
<symbol id="account" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol></defs></svg>
<div class="app"><aside class="side"><div class="brand"><div class="mk">E</div>ADHD Ease</div><nav class="nav" id="nav" aria-label="Main"></nav><div class="sf">Prototype. Your data is saved in this browser only. Cloud sync and billing are not connected.</div></aside>
<div><div class="mh"><div class="mk" style="width:30px;height:30px;font-size:17px">E</div>ADHD Ease</div><main id="main"></main></div></div>
<nav class="tabs" id="tabs" aria-label="Mobile"></nav><div id="toast" role="status"></div>
<script>
const K='adhdease.v2';let S={tasks:[],cur:null,log:[],name:''};let draft={},stp=1,pg=1,tl=0,tint=null,tmin=10,tdone=false,tOpen=false,delId=null,wipeAsk=false,storeOK=true,lastSaved=null,recovered=false;
/* Storage adapter: replace Store (and fill Backend) to add cloud sync, sign-in and billing later. */
const Store={raw(){try{return localStorage.getItem(K)}catch(e){return null}},save(d){try{localStorage.setItem(K,JSON.stringify(d));storeOK=true;lastSaved=new Date().toISOString()}catch(e){storeOK=false}},backup(r){try{localStorage.setItem(K+'.backup',r)}catch(e){}}};
const Backend={auth:null,cloudSync:null,billing:null};
const $=s=>document.querySelector(s),persist=()=>Store.save(S);
const uid=()=>Math.random().toString(36).slice(2,9),cur=()=>S.tasks.find(t=>t.id===S.cur);
const log=m=>{S.log.unshift({m,d:new Date().toISOString()});S.log=S.log.slice(0,30)};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dt=d=>new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const fmt=s=>Math.floor(s/60)+':'+('0'+s%60).slice(-2);
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.className='s';clearTimeout(tt);tt=setTimeout(()=>t.className='',2400)};
const NAV=[['home','Home','Home'],['steps','5-Step System','Steps'],['planner','My Planner','Planner'],['audio','Guided Audio','Audio'],['guide','System Guide','Guide'],['progress','My Progress','Progress'],['account','Account','Account']];
const SD=[
{n:'Understand Your Task',s:'Identify the task and clarify the desired outcome.',p:'Name the task clearly and decide what "finished" looks like.',e:'A task feels heavy when it is vague. Writing down exactly what needs doing, and what done looks like, turns a cloud of "everything" into one defined thing you can picture.',x:'Write the task in one sentence. Then describe the finished result as if you could take a photo of it.',eg:'Task: Organize the kitchen counter. Finished: the counter is clear except the kettle and the fruit bowl.'},
{n:'Choose Your Priority',s:'Select one task to focus on.',p:'Select the one task that gets your attention first.',e:'Trying to handle everything at once makes starting harder. Choosing one priority gives you permission to let the rest wait for now.',x:'Look at your tasks. Pick one, say why it matters now, and name what can wait.',eg:'Priority: the kitchen counter, because I cook there tomorrow. Can wait: sorting the spice drawer.'},
{n:'Break It Down',s:'Turn the task into smaller actions.',p:'Divide the task into small actions you can picture doing.',e:'A big task has many actions hidden inside it. Listing them makes each one smaller and clearer, so the next move is easy to see.',x:'Add each small action in the order you would do it. Edit, remove or reorder them any time.',eg:'Remove unnecessary items. Put dishes in the sink. Wipe the counter. Return essential items. Check the finished area.'},
{n:'Start & Take Action',s:'Identify the first action and begin.',p:'Choose one clear first action, prepare, and decide when to begin.',e:'You do not need to finish everything today. You only need a clear first action, what you need to start it, and a time you intend to begin.',x:'Pick your first action, list what you need, and set a starting time. The timer is optional.',eg:'First action: clear the items I do not need. I need a trash bag. I will begin at 5:30 PM.'},
{n:'Track & Follow Through',s:'Review progress and decide what comes next.',p:'Review what you did and decide what happens next.',e:'Looking back shows what moved forward and what still needs attention. Writing your next action means you start the next session with a clear move.',x:'Check your completed and remaining actions, note what helped, then write your next action.',eg:'What helped: starting with the clutter. Needs attention: the shelf above. Next: wipe the counter.'}];
const mk=d=>({id:uid(),title:d.title||'',desc:'',outcome:d.outcome||'',barrier:d.barrier||'',info:d.info||'',now:'',reason:'',wait:'',prio:'Normal',stage:1,status:'Not started',created:new Date().toISOString(),actions:[],first:'',when:'',need:'',notes:'',daily:'',worked:'',attn:'',next:''});
const bump=(t,n)=>{t.stage=Math.min(5,Math.max(t.stage,n))},done=t=>t.actions.filter(a=>a.done).length,pct=t=>t.actions.length?Math.round(done(t)/t.actions.length*100):0;
const fld=(l,f,v,ta)=>`<label class="f"><span>${l}</span>${ta?`<textarea rows="3" data-f="${f}">${esc(v)}</textarea>`:`<input data-f="${f}" value="${esc(v)}">`}</label>`;
const ico=n=>`<svg class="i"><use href="#${n}"/></svg>`,bar=p=>`<div class="bar" role="img" aria-label="${p}% complete"><i style="width:${p}%"></i></div>`;
const empty=(m,b)=>`<div class="empty"><p>${m}</p>${b||''}</div>`;
const newBtn=`<button class="btn" data-a="new">Start a New Task</button>`;
const needT=()=>empty('Choose or create a task first.',`<button class="btn sm" data-go="planner" data-pg="1">Open Task Dashboard</button>`);
const stg=t=>t.status==='Completed'?5:t.stage-1;

const str=v=>typeof v==='string'?v:'';
function clean(o){const r={tasks:[],cur:null,log:[],name:''};if(!o||typeof o!=='object'||!Array.isArray(o.tasks))return r;r.name=str(o.name);
r.tasks=o.tasks.filter(t=>t&&typeof t==='object').map(t=>{const b=mk({});for(const k in b){if(k==='actions'||k==='stage')continue;if(typeof t[k]==='string')b[k]=t[k]}b.id=str(t.id)||b.id;b.stage=Math.min(5,Math.max(1,parseInt(t.stage)||1));if(isNaN(new Date(b.created)))b.created=new Date().toISOString();
b.actions=(Array.isArray(t.actions)?t.actions:[]).filter(a=>a&&typeof a.t==='string').map(a=>({id:str(a.id)||uid(),t:a.t,done:!!a.done}));return b});
r.cur=r.tasks.some(t=>t.id===o.cur)?o.cur:null;r.log=(Array.isArray(o.log)?o.log:[]).filter(l=>l&&typeof l.m==='string'&&!isNaN(new Date(l.d))).slice(0,30);return r}
{const raw=Store.raw();if(raw){try{const o=JSON.parse(raw);if(!o||!Array.isArray(o.tasks))throw 0;S=clean(o)}catch(e){Store.backup(raw);recovered=true}}}
const nextOf=t=>{if(t.status==='Completed')return 'This task is complete. Start a new task when you are ready.';if(t.next)return t.next;const fa=t.actions.find(a=>a.id===t.first&&!a.done);if(fa)return 'Begin with: '+fa.t;return ['Describe the task you want to complete.','Choose the one task to focus on first.','Break the task into small actions.','Choose your first action and begin.','Review your progress and set your next action.'][t.stage-1]};
function home(){const t=cur(),has=S.tasks.length>0;
const focus=t?`<h3 style="font-size:22px;margin:8px 0 4px">${esc(t.title)}</h3><p class="mu">Step ${t.stage} of 5 — ${SD[t.stage-1].n}</p><div style="margin:12px 0">${bar(stg(t)*20)}</div><p class="mu" style="font-size:17px">${stg(t)} of 5 steps completed${t.actions.length?` · ${done(t)} of ${t.actions.length} actions (${pct(t)}%)`:''}</p><div class="eg" style="margin:12px 0"><b>Next recommended action</b><br>${esc(nextOf(t))}</div><div class="row"><button class="btn" data-go="steps" data-stp="${t.stage}">Continue</button><button class="btn o" data-a="new">Start a New Task</button></div>`
:has?empty('No task is open. Reopen one from your planner, or start a new one.',`<button class="btn sm" data-go="planner" data-pg="7">Open Task History</button>`)
:`<p>Pick one task you have been putting off. It can be small, like replying to an email.</p><ol class="mu" style="padding-left:22px;margin:0 0 14px"><li>Describe it in one sentence (Step 1).</li><li>Choose it as your one priority (Step 2).</li><li>Break it into small actions (Step 3).</li><li>Choose your first action and begin (Step 4).</li></ol><div class="row"><button class="btn" data-a="new">Start a New Task</button><button class="btn o" data-go="audio">Listen to the guided start</button></div><details style="margin-top:14px"><summary class="mu">See a demonstration example (not your data)</summary><div class="eg"><b>Example only</b><br>Task: Organize the kitchen counter.<br>First action: remove unnecessary items.<br>Then: put dishes in the sink, wipe the counter, return essential items, check the finished area.</div></details>`;
return `<header class="top"><h1>Welcome to ADHD Ease</h1><p>A clearer way to approach the tasks you've been putting off.</p></header>
<p style="font-size:20px">ADHD Ease helps you move from knowing what to do to taking the first small action. Instead of planning everything, you clarify one task, choose one priority, shrink it into small actions, and begin with one. It is an educational, coaching-inspired tool, not a medical treatment.</p>
<div class="g g2" style="align-items:center;margin-top:18px"><section class="card pale" aria-labelledby="cf"><h2 id="cf" style="font-size:20px">${has?'Current Focus':'Begin here'}</h2>${focus}</section>
<div class="prev" aria-hidden="true"><div class="paper a"><h5>Task Breakdown</h5><s></s><s></s><s></s><s></s></div><div class="paper b"><h5>Priority Planner</h5><u></u><u style="width:70%"></u><u></u><u style="width:50%"></u></div><div class="paper c"><h5>Daily Action Plan</h5><u></u><s></s><s></s><u style="width:60%"></u></div></div></div>
<section class="sec"><h2>The Five-Step System</h2><p class="lead">One path from a task you keep avoiding to a clear next action.</p><div class="g g5" style="margin-top:16px">${SD.map((s,i)=>`<button class="sc ${t&&i<stg(t)?'done':''} ${t&&i+1===t.stage&&t.status!=='Completed'?'on':''}" data-go="steps" data-stp="${i+1}"><b>${i+1}</b><h4>${s.n}</h4><p>${s.s}</p></button>`).join('')}</div></section>
<section class="sec"><div class="g g4">${[['planner','My Planner','Seven pages for your tasks and daily plan.'],['audio','Guided Audio','A spoken guided start, with transcript.'],['progress','My Progress','Your saved tasks and actions.'],['guide','System Guide','How each step works.']].map(q=>`<button class="sc" data-go="${q[0]}"><h4>${q[1]}</h4><p>${q[2]}</p></button>`).join('')}</div></section>
${S.log.length?`<section class="sec"><h2>Recent Activity</h2><div class="card">${S.log.slice(0,5).map(l=>`<div class="hist"><span>${esc(l.m)}</span><span class="mu" style="font-size:16px">${dt(l.d)}</span></div>`).join('')}</div></section>`:''}`}
function rows(t){return (t.actions.length?t.actions.map(a=>`<div class="act ${a.done?'d':''}"><button class="ck ${a.done?'on':''}" data-a="tog" data-i="${a.id}" aria-label="Toggle done">${a.done?'✓':''}</button><input type="text" data-aid="${a.id}" value="${esc(a.t)}" aria-label="Edit action"><button class="x" data-a="mv" data-i="${a.id}" data-d="-1" aria-label="Move up">↑</button><button class="x" data-a="mv" data-i="${a.id}" data-d="1" aria-label="Move down">↓</button><button class="x" data-a="del" data-i="${a.id}" aria-label="Delete">×</button></div>`).join(''):'<p class="mu">No actions yet. Add your first one below.</p>')+`<div class="row" style="margin-top:10px"><input id="na" class="inp" style="flex:1" placeholder="Add a small action" aria-label="New action"><button class="btn o" data-a="add">Add action</button></div>`}
function tBreak(t,n){return `<p><b>Main task:</b> ${esc(t.title)}</p>${t.actions.length?`<div style="margin:8px 0 14px">${bar(pct(t))}<p class="mu" style="font-size:17px;margin-top:4px">${done(t)} of ${t.actions.length} actions complete (${pct(t)}%)</p></div>`:''}${rows(t)}<div class="row" style="margin-top:16px"><button class="btn" data-a="s3" ${n?`data-nx="${n}"`:''}>${n?'Save and continue':'Save breakdown'}</button>${t.actions.length?'':'<button class="btn o" data-a="ex">Insert example actions</button>'}</div>`}
function tPrio(t,n){const o=S.tasks.filter(x=>x.status!=='Completed');return `<span class="f"><span>What is my chosen priority?</span></span>${o.map(x=>`<button class="pick ${x.id===S.cur?'on':''}" data-a="pick" data-i="${x.id}"><i></i>${esc(x.title)}</button>`).join('')}<div style="margin-top:16px">${fld('What needs my attention first?','now',t.now,1)}${fld('Why does this task matter now?','reason',t.reason,1)}${fld('What can wait?','wait',t.wait,1)}<button class="btn" data-a="s2" ${n?`data-nx="${n}"`:''}>${n?'Save and continue':'Set as my priority'}</button></div>`}
function tFirst(t,n){const o=t.actions.filter(a=>!a.done);return `<p class="mu">Begin with one small action. That is enough for now.</p><label class="f"><span>My first action</span>${o.length?`<select data-f="first"><option value="">Choose an action</option>${o.map(a=>`<option value="${a.id}" ${t.first===a.id?'selected':''}>${esc(a.t)}</option>`).join('')}</select>`:'<p class="mu">Add actions in the Task Breakdown to choose one.</p>'}</label>${fld('What I need before starting','need',t.need,1)}${fld('When will I begin?','when',t.when)}
<div class="row"><button class="btn" data-a="start" ${n?`data-nx="${n}"`:''}>Start action</button></div><details id="tdet" ${tOpen?"open":""} style="margin-top:18px"><summary class="mu">Optional focus timer</summary><div class="row" style="margin:10px 0">${[5,10,15,25].map(m=>`<button class="btn o sm" data-a="tm" data-m="${m}">${m} min</button>`).join('')}<b id="tmd" style="font:600 26px 'Bodoni Moda',serif;margin:0 8px">${fmt(tl||tmin*60)}</b><button class="btn sm" id="tmb" data-a="tgo">${tint?'Pause':'Start timer'}</button><button class="btn o sm" data-a="trs">Reset</button></div><p class="mu" id="tmm" style="font-size:17px">${tdone?'Time is up. Stop here, or keep going if you want. Your choice.':'Use it only if it helps.'}</p></details>`}
function tReview(t,n){return `<div class="g g2" style="margin-bottom:16px"><div class="card pale"><h4>Completed actions (${done(t)})</h4>${t.actions.filter(a=>a.done).map(a=>`<p style="margin:4px 0">✓ ${esc(a.t)}</p>`).join('')||'<p class="mu">None yet.</p>'}</div><div class="card"><h4>Remaining actions (${t.actions.length-done(t)})</h4>${t.actions.filter(a=>!a.done).map(a=>`<p style="margin:4px 0">• ${esc(a.t)}</p>`).join('')||'<p class="mu">None remaining.</p>'}</div></div>${bar(pct(t))}<div style="height:16px"></div>${fld('What helped me make progress?','worked',t.worked,1)}${fld('What needs attention?','attn',t.attn,1)}${fld('My next action','next',t.next)}<div class="row"><button class="btn" data-a="s5">Save review</button><button class="btn o" data-a="fin">Mark task complete</button></div>`}
function steps(){const t=cur(),d=t||draft,s=SD[stp-1];let b;
if(stp===1)b=`${fld('What do I need to do?','title',d.title)}${fld('What would completing this task look like?','outcome',d.outcome,1)}${fld('What is making it difficult to approach?','barrier',d.barrier,1)}${fld('What information do I already have?','info',d.info,1)}<button class="btn" data-a="s1" data-nx="2">Save and continue</button>`;
else if(!t)b=empty('Start with Step 1 to describe your task.',`<button class="btn sm" data-a="stp" data-n="1">Go to Step 1</button>`);
else b=[0,()=>tPrio(t,3),()=>tBreak(t,4),()=>tFirst(t,5),()=>tReview(t)][stp-1]();
return `<header class="top"><h1>The Five-Step System</h1><p>${t?esc(t.title):'Begin with one task.'}</p></header><div class="st">${SD.map((x,i)=>`<button class="${stp===i+1?'on':''}" data-a="stp" data-n="${i+1}" aria-current="${stp===i+1?'step':'false'}"><b>${i+1}</b>${x.n}</button>`).join('')}</div>
<section class="card"><div class="folio">Step ${stp} of 5</div><h2>${s.n}</h2><p class="lead" style="margin-top:6px">${s.p}</p><p>${s.e}</p><p><b>Your exercise:</b> ${s.x}</p><div class="eg"><b>Example</b><br>${s.eg}</div>${b}<div class="nav2">${stp>1?`<button class="btn o sm" data-a="stp" data-n="${stp-1}">Previous</button>`:'<span></span>'}${stp<5?`<button class="btn o sm" data-a="stp" data-n="${stp+1}">Next</button>`:`<button class="btn o sm" data-go="planner">Open planner</button>`}</div></section>`}

const PG=['Task Dashboard','Task Breakdown','Priority Planner','First Action Planner','Daily Action Plan','Progress Review','Task History'];
function histList(){return S.tasks.length?S.tasks.map(x=>`<div class="hist"><div><b>${esc(x.title)}</b><br><span class="mu" style="font-size:16px">${x.prio} · ${x.status} · ${dt(x.created)} · ${done(x)}/${x.actions.length} actions</span><div style="width:180px;margin-top:4px">${bar(pct(x))}</div></div><div class="row">${x.id===S.cur?'<span class="tag">Open now</span>':`<button class="btn o sm" data-a="reopen" data-i="${x.id}">Reopen</button>`}${delId===x.id?`<span class="mu" style="font-size:16px">Delete this task?</span><button class="btn sm" data-a="deltask" data-i="${x.id}">Confirm</button><button class="btn o sm" data-a="cancel">Cancel</button>`:`<button class="btn o sm" data-a="askdel" data-i="${x.id}">Delete</button>`}</div></div>`).join(''):empty('Tasks you create will appear here.')}
function planner(){const t=cur();let b;
if(pg===1)b=`<div class="row" style="margin-bottom:16px"><input id="qt" class="inp" style="flex:1" placeholder="Add a new task" aria-label="New task title"><button class="btn" data-a="qadd">Add task</button></div>${histList()}${t?`<div style="margin-top:22px"><h3 style="margin-bottom:10px">Open task</h3>${fld('Title','title',t.title)}${fld('Description','desc',t.desc,1)}<div class="g g2"><label class="f"><span>Priority</span><select data-f="prio">${['Top priority','Normal','Later'].map(p=>`<option ${t.prio===p?'selected':''}>${p}</option>`).join('')}</select></label><label class="f"><span>Status</span><select data-f="status">${['Not started','In progress','Completed'].map(p=>`<option ${t.status===p?'selected':''}>${p}</option>`).join('')}</select></label></div></div>`:''}`;
else if(pg===7)b=histList();
else if(!t)b=needT();
else if(pg===2)b=tBreak(t);else if(pg===3)b=tPrio(t);else if(pg===4)b=tFirst(t);
else if(pg===5){const fa=t.actions.find(a=>a.id===t.first),o=t.actions.filter(a=>!a.done&&a.id!==t.first);b=`<p><b>Today's priority:</b> ${esc(t.title)}</p><p><b>First action:</b> ${fa?esc(fa.t):'<span class="mu">Choose it on the First Action page.</span>'}</p><p><b>Action list:</b> ${o.length?o.map(a=>esc(a.t)).join('; '):'<span class="mu">No other open actions.</span>'}</p>${fld('Notes','notes',t.notes,1)}${fld('Daily review','daily',t.daily,1)}`}
else b=`<div class="row" style="gap:32px;margin-bottom:12px"><div class="stat"><b>${t.actions.length}</b><span>Total</span></div><div class="stat"><b>${done(t)}</b><span>Completed</span></div><div class="stat"><b>${t.actions.length-done(t)}</b><span>Remaining</span></div></div>${tReview(t)}`;
return `<header class="top"><h1>My Planner</h1><p>Seven pages, connected to your five steps.${t?' Task: '+esc(t.title):''}</p></header><div class="pg">${PG.map((x,i)=>`<button class="${pg===i+1?'on':''}" data-a="pg" data-n="${i+1}">${i+1}. ${x}</button>`).join('')}</div><section class="card"><div class="folio">Page ${pg}</div><h2 style="margin-bottom:14px">${PG[pg-1]}</h2>${b}</section>`}

const SC=[
['Settle on one task',['Welcome to ADHD Ease. This is a short guided start. It takes just a few minutes.','You can sit, stand, or walk around while you listen. Let your shoulders drop, and take one slow breath.','You do not need to think about everything you have to do today. Right now, there is only one task.','Bring to mind one task you have been putting off. Choose the first one that comes to mind. It does not have to be the most important one.','Hold that task in mind. It is the only task for this session.']],
['Understand the task',['Step one is to understand your task.','Say it to yourself in one plain sentence. For example, I need to answer that email, or I need to clear the kitchen counter.','Now picture it finished. What would you see? What would be different?','Next, notice what makes it hard to start. Maybe it feels vague. Maybe it feels too big. Maybe you are not sure where to begin. You do not have to fix that yet. Just notice it.','Finally, think about what you already know. Do you have what you need, or is something missing?']],
['Choose one priority',['Step two is to choose one priority.','If other tasks come to mind, let them wait. You can come back to them later. They will still be there.','Ask yourself, why does this task matter now? Maybe a deadline is close. Maybe it has been weighing on you. Maybe finishing it would make tomorrow easier.','Then tell yourself, this is my one priority for now.']],
['Break it into small actions',['Step three is to break the task down.','Think about the smallest actions that make up this task. Small means you can picture yourself doing it in a few minutes.','For example, instead of clean the kitchen, you might think: put dishes in the sink, wipe the counter, take out the trash.','You do not need a perfect list. Two or three small actions are enough to start. You can add more later.','If an action still feels big, make it smaller.']],
['Choose the first action',['Step four is to choose your first action.','Look at your small actions. Which one feels easiest to begin? Choose that one.','Now ask yourself, what do I need before I start? Maybe a trash bag, your laptop, or a glass of water. Get it ready.','Decide when you will begin. It could be right now, or at a specific time today.','You do not have to finish everything. Your only job is to begin with this one action. If it helps, use the focus timer for five minutes. You can stop when it ends.']],
['Review and continue',['Step five is to review and continue. This is for after you have taken action, even a small one.','Look at what you did. Notice what helped you get started. Notice what is still waiting.','Then choose your next action, and write it down so it is ready for next time.','You have identified your task, chosen a priority, and created a starting point. Use the system one step at a time. When you are ready, open the five-step system and begin.']]];
/* To add real recordings later: save one MP3 per section and map the section number (0-5) to its path, e.g. {0:'audio/01-settle.mp3',1:'audio/02-understand.mp3'}. Sections without a file keep using device speech. */
const AUDIO_FILES={};
const TTS='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;
const hasFiles=()=>Object.keys(AUDIO_FILES).length>0,canPlay=()=>TTS||hasFiles();
let aIdx=0,aSt='idle',aTok=0,aRate=1,aVoice='',voices=[],aEl=null;
const aupd=()=>{if(rt()==='audio')render(true)};
function loadVoices(){voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));if(aSt==='idle')aupd()}
if(TTS&&speechSynthesis.addEventListener)speechSynthesis.addEventListener('voiceschanged',loadVoices);
function stopAll(){aTok++;if(aEl){aEl.onended=null;aEl.pause();aEl=null}if(TTS)speechSynthesis.cancel()}
function speak(i){if(!canPlay())return;const tok=++aTok;if(aEl){aEl.onended=null;aEl.pause();aEl=null}if(TTS){speechSynthesis.cancel();speechSynthesis.resume()}aIdx=i;aSt='playing';
const next=()=>{if(tok!==aTok)return;if(i<SC.length-1)speak(i+1);else{aSt='done';aupd()}};
if(AUDIO_FILES[i]){aEl=new Audio(AUDIO_FILES[i]);aEl.playbackRate=aRate;aEl.onended=next;aEl.onerror=()=>{if(tok!==aTok)return;aSt='idle';aupd();toast('Could not load the recording.')};aEl.play().catch(()=>{});aupd();return}
if(!TTS){aSt='idle';return}
const u=new SpeechSynthesisUtterance(SC[i][1].join(' '));u.rate=aRate;const v=voices.find(x=>x.voiceURI===aVoice);if(v){u.voice=v;u.lang=v.lang}else u.lang='en-US';
u.onend=next;u.onerror=e=>{if(tok!==aTok||e.error==='canceled'||e.error==='interrupted')return;aSt='idle';aupd();toast('Speech could not play in this browser.')};
setTimeout(()=>{if(tok===aTok)speechSynthesis.speak(u)},60);aupd()}
function audio(){const n=SC.length,words=SC.reduce((a,s)=>a+s[1].join(' ').split(/\s+/).length,0);
const st={idle:'Ready. Press Play to begin.',playing:`Playing section ${aIdx+1} of ${n}: ${SC[aIdx][0]}`,paused:`Paused at section ${aIdx+1} of ${n}: ${SC[aIdx][0]}`,done:'Finished. Press Play to listen again.'}[aSt];
const src=hasFiles()&&AUDIO_FILES[aIdx]?'Recorded audio.':'Read aloud by your device\'s built-in voice. This is not a recorded voice, so the sound depends on your browser and device.';
const ctl=canPlay()?`<div class="row" style="margin:14px 0"><button class="btn o sm" data-a="aprev" aria-label="Previous section">‹ Previous</button><button class="btn" data-a="aplay">${aSt==='paused'?'Resume':aSt==='done'?'Play again':'Play'}</button><button class="btn o" data-a="apause" ${aSt==='playing'?'':'disabled'}>Pause</button><button class="btn o" data-a="astop">Stop</button><button class="btn o" data-a="arestart">Restart</button><button class="btn o sm" data-a="anext" aria-label="Next section">Next ›</button></div>${bar(aSt==='idle'?0:Math.round((aIdx+1)/n*100))}<p role="status" aria-live="polite" style="margin-top:8px"><b>${st}</b></p>
<div class="g g2" style="margin-top:10px">${TTS?`<label class="f"><span>Voice</span><select data-v="voice"><option value="">Browser default</option>${voices.map(v=>`<option value="${esc(v.voiceURI)}" ${v.voiceURI===aVoice?'selected':''}>${esc(v.name)}</option>`).join('')}</select></label>`:''}<label class="f"><span>Speaking speed</span><select data-v="rate">${[[.75,'Slow'],[.9,'Relaxed'],[1,'Normal'],[1.15,'Brisk']].map(r=>`<option value="${r[0]}" ${r[0]===aRate?'selected':''}>${r[1]}</option>`).join('')}</select></label></div><p class="mu" style="font-size:17px">A new voice or speed applies from the next section.</p>`:`<div class="empty" style="margin-top:14px"><p>Your browser does not support spoken playback. Please read the transcript below.</p></div>`;
return `<header class="top"><h1>Guided Audio</h1><p>A guided start for one task, built on the five steps.</p></header>
<section class="card"><div class="row cv" style="gap:28px;align-items:flex-start"><div class="cover" aria-hidden="true"><b>ADHD EASE</b></div><div style="flex:1;width:100%"><h2>The ADHD Ease Guided Start</h2><p class="mu">Settle on one task, understand it, choose it, shrink it, and pick your first action. Use it before you begin, or any time you feel stuck.</p><p class="mu" style="font-size:17px">${n} sections · about ${Math.ceil(words/150)} minutes. ${src}</p>${ctl}</div></div></section>
<section class="card" style="margin-top:22px"><h2>Transcript</h2><div style="margin-top:8px">${SC.map((x,i)=>`<div class="tr ${aSt!=='idle'&&i===aIdx?'cur':''}"><b>${i+1}</b><h4>${x[0]}</h4>${x[1].map(l=>`<p>${l}</p>`).join('')}${canPlay()?`<div><button class="btn o sm" style="margin-top:8px" data-a="asec" data-i="${i}">Play from here</button></div>`:''}</div>`).join('')}</div></section>`}
function guide(){const sec=(h,b)=>`<section class="gd"><h3>${h}</h3>${b}</section>`;
return `<header class="top"><h1>System Guide</h1><p>How ADHD Ease works, step by step.</p></header><div class="card" style="max-width:820px">
${sec('What ADHD Ease is','<p>ADHD Ease is an educational, coaching-inspired system for starting and following through with everyday tasks. It walks you through one task at a time using five connected steps, a planner and a short guided audio.</p><p>It is a productivity tool. It is not medical advice or a treatment, and it does not replace care from a health professional.</p>')}
${sec('Who it is designed for','<p>It is designed for adult women with ADHD who know what they need to do but find it hard to begin and to keep going. If you have ever stared at a task you fully understand and still could not move, this is for you.</p>')}
${sec('The task initiation problem','<p>Task initiation means getting started. Knowing what to do and beginning are different skills, and the space between them can feel huge.</p><div class="gap"><span>I know what to do</span><i></i><span>I have started</span></div><p>ADHD Ease shortens that space by making the task clear, small and specific before you try to act.</p>')}
${sec('Why five stages','<p>A stuck task is usually vague, crowded or unprepared. Each stage removes one of those obstacles: first clarity, then focus, then size, then a clear first move, then a way to follow through. Doing them in order means you never face the whole problem at once.</p><div class="flow"><span>1 Understand</span><em>→</em><span>2 Prioritize</span><em>→</em><span>3 Break down</span><em>→</em><span>4 Act</span><em>→</em><span>5 Review</span></div>')}
${SD.map((s,i)=>sec(`Stage ${i+1}: ${s.n}`,`<p>${s.e}</p><p><b>Exercise:</b> ${s.x}</p><div class="eg"><b>Example</b><br>${s.eg}</div>`)).join('')}
${sec('How to use the planner','<p>The planner has seven pages: Task Dashboard, Task Breakdown, Priority Planner, First Action Planner, Daily Action Plan, Progress Review and Task History. Start on the Task Dashboard to add a task, then move through the pages. It shares data with the five steps, so anything you write in one place appears in the other. Reopen or delete older tasks from Task History.</p>')}
${sec('How to use the guided audio','<p>Open Guided Audio and press Play. It speaks six short sections in your browser. You can pause, resume, stop, restart, jump to any section, change the voice and change the speed. Use it before you begin a task to settle on one thing to do.</p>')}
${sec('How to review progress','<p>Open Progress Review in the planner for one task, or My Progress for all of them. Ask what helped, what needs attention and what your next action is. Counts come only from what you have saved.</p>')}
<p style="margin-top:20px"><button class="btn" data-a="new">Start a New Task</button></p></div>`}
const pc=(a,b)=>b?Math.round(a/b*100):0;
function progress(){const T=S.tasks,ta=T.reduce((n,t)=>n+t.actions.length,0),ac=T.reduce((n,t)=>n+done(t),0),tc=T.filter(t=>t.status==='Completed').length,ip=T.filter(t=>t.status==='In progress').length;
return `<header class="top"><h1>My Progress</h1><p>Built only from what you have saved on this device.</p></header><div class="g g4">${[['Tasks created',T.length],['Tasks completed',tc],['Tasks in progress',ip],['Total actions',ta],['Actions completed',ac],['Remaining actions',ta-ac],['Task completion',pc(tc,T.length)+'%'],['Action completion',pc(ac,ta)+'%']].map(s=>`<div class="card pale stat"><b>${s[1]}</b><span>${s[0]}</span></div>`).join('')}</div>
<section class="card" style="margin-top:22px"><h2>Task History</h2>${T.length?T.map(t=>`<div class="hist"><div style="flex:1"><b>${esc(t.title)}</b><span class="mu" style="font-size:16px"> · ${t.status} · ${dt(t.created)} · ${done(t)}/${t.actions.length} actions</span>${bar(pct(t))}</div><span class="mu">${pct(t)}%</span></div>`).join(''):empty('No tasks yet.',newBtn)}</section>
<section class="card" style="margin-top:22px"><h2>Recent Activity</h2>${S.log.length?S.log.slice(0,10).map(l=>`<div class="hist"><span>${esc(l.m)}</span><span class="mu" style="font-size:16px">${dt(l.d)}</span></div>`).join(''):empty('No activity yet. Your first saved step will show up here.')}</section>`}
function account(){return `<header class="top"><h1>Account</h1><p>Profile, subscription and your data.</p></header><div class="g g2"><section class="card"><h2>Profile</h2><label class="f" style="margin-top:12px"><span>Your name</span><input data-o="S" data-f="name" value="${esc(S.name)}" placeholder="Optional"></label><p class="mu">Your name is stored in this browser only.</p></section>
<section class="card pale"><h2>Sign-in and subscription</h2><p><span class="tag">Not connected</span></p><p><b>Status: no subscription.</b> This prototype is free and has no sign-in, payments or billing. Nothing is charged or confirmed.</p></section></div>
<section class="card" style="margin-top:22px"><h2>Needs a future backend</h2>${[['User accounts and sign-in','Authentication service'],['Saving data across devices','Cloud database'],['Monthly subscription and billing','Payment provider'],['iOS and Android apps','App store builds']].map(r=>`<div class="hist"><span>${r[0]}</span><span class="mu" style="font-size:16px">${r[1]}</span></div>`).join('')}</section>
<section class="card" style="margin-top:22px"><h2>Your data</h2><p>Your tasks are saved automatically in this browser (local storage). They do not sync to other devices and can be lost if you clear browser data. ${storeOK?'':'<b>This browser is blocking storage, so nothing is being saved.</b>'} Export a backup to move data between devices.</p><p class="mu" style="font-size:17px">Storage: ${S.tasks.length} task${S.tasks.length===1?'':'s'}, about ${(new Blob([JSON.stringify(S)]).size/1024).toFixed(1)} KB, saved in this browser under the key "${K}".${lastSaved?' Last saved '+new Date(lastSaved).toLocaleTimeString()+'.':''}</p>
<label class="f"><span>Backup data (export fills this box, import reads it)</span><textarea id="dj" class="inp" rows="4"></textarea></label><div class="row"><button class="btn" data-a="exp">Export data</button><button class="btn o" data-a="imp">Import from box</button><label class="btn o" style="cursor:pointer">Import from file<input type="file" accept=".json,application/json" id="imf" hidden></label></div><p class="mu" style="font-size:17px;margin-top:8px">Importing replaces your current data.</p>
<div class="row" style="margin-top:14px">${wipeAsk?'<span>Delete everything saved here?</span><button class="btn sm" data-a="wipe">Yes, delete</button><button class="btn o sm" data-a="cancel">Cancel</button>':'<button class="btn o sm" data-a="askwipe">Clear all data</button>'}</div></section>`}
const V={home,steps,planner,audio,guide,progress,account};
const rt=()=>{const r=(location.hash||'#home').slice(1);return V[r]?r:'home'};
function render(keep){const y=scrollY,r=rt();$('#main').innerHTML=(recovered?'<div class="eg" style="margin:0 0 20px"><b>Notice</b><br>Your saved data could not be read, so you are starting fresh. A copy of the old data was kept in this browser as a backup. <button class="btn o sm" data-a="dismiss">Dismiss</button></div>':'')+V[r]();
const nv=i=>NAV.map(n=>`<button data-go="${n[0]}" ${n[0]===r?'aria-current="page"':''}>${ico(n[0])}${n[i]}</button>`).join('');$('#nav').innerHTML=nv(1);$('#tabs').innerHTML=nv(2);
scrollTo(0,keep?y:0)}
const go=r=>location.hash==='#'+r?render():location.hash=r;addEventListener('hashchange',()=>render());
const tg=el=>el.dataset.o==='S'?S:(cur()||draft);
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.aid){cur().actions.find(x=>x.id===el.dataset.aid).t=el.value;persist();return}if(el.dataset.f){tg(el)[el.dataset.f]=el.value;persist()}});
document.addEventListener('change',e=>{const el=e.target;if(['first','status','prio','title'].includes(el.dataset.f))render(true);
if(el.dataset.v==='voice')aVoice=el.value;if(el.dataset.v==='rate')aRate=+el.value;
if(el.id==='imf'&&el.files[0]){const r=new FileReader();r.onload=()=>impText(String(r.result));r.onerror=()=>toast('Could not read that file.');r.readAsText(el.files[0])}});
document.addEventListener('toggle',e=>{if(e.target.id==='tdet')tOpen=e.target.open},true);
const sv=m=>{persist();toast(m||'Saved on this device');render(true);return true};
function impText(tx){let o;try{o=JSON.parse(tx)}catch(e){return toast('That is not valid backup data.')}if(!o||!Array.isArray(o.tasks))return toast('That file is not an ADHD Ease backup.');S=clean(o);draft={};persist();log('Imported data');persist();toast('Imported '+S.tasks.length+' task'+(S.tasks.length===1?'':'s'));render()}
const tuv=()=>{const d=$('#tmd'),b=$('#tmb'),m=$('#tmm');if(d)d.textContent=fmt(tl||tmin*60);if(b)b.textContent=tint?'Pause':'Start timer';if(m)m.textContent=tdone?'Time is up. Stop here, or keep going if you want. Your choice.':'Use it only if it helps.'};
const A={
new(){S.cur=null;draft={};stp=1;go('steps')},stp(b){stp=+b.dataset.n;go('steps')},pg(b){pg=+b.dataset.n;render()},
s1(){const t=cur(),d=t||draft;if(!(d.title||'').trim())return toast('Describe your task first.');if(!t){const n=mk(d);S.tasks.unshift(n);S.cur=n.id;log('Created task: '+n.title)}else log('Updated task: '+t.title);bump(cur(),2);return sv()},
qadd(){const v=$('#qt').value.trim();if(!v)return toast('Type a task first.');const n=mk({title:v});S.tasks.unshift(n);S.cur=n.id;bump(n,2);log('Created task: '+v);sv('Task added')},
pick(b){S.cur=b.dataset.i;persist();render(true)},
s2(){const t=cur();S.tasks.forEach(x=>{if(x.prio==='Top priority'&&x!==t)x.prio='Normal'});t.prio='Top priority';bump(t,3);log('Chose priority: '+t.title);return sv()},
add(){const v=$('#na').value.trim();if(!v)return toast('Type an action first.');cur().actions.push({id:uid(),t:v,done:false});sv('Action added')},
del(b){const t=cur();t.actions=t.actions.filter(a=>a.id!==b.dataset.i);sv('Action removed')},
mv(b){const L=cur().actions,i=L.findIndex(a=>a.id===b.dataset.i),j=i+ +b.dataset.d;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];persist();render(true)},
tog(b){const t=cur(),a=t.actions.find(x=>x.id===b.dataset.i);a.done=!a.done;if(a.done){log('Completed: '+a.t);if(t.status==='Not started')t.status='In progress'}persist();render(true)},
ex(){cur().actions=['Remove unnecessary items.','Put dishes in the sink.','Wipe the counter.','Return essential items.','Check the finished area.'].map(t=>({id:uid(),t,done:false}));sv('Example actions added. Edit them freely.')},
s3(){const t=cur();if(!t.actions.length)return toast('Add at least one action.');bump(t,4);log('Broke down: '+t.title);return sv()},
start(){const t=cur(),a=t.actions.find(x=>x.id===t.first);if(!a)return toast('Choose your first action.');t.status='In progress';bump(t,5);log('Started: '+a.t);return sv('Begin with: '+a.t)},
tm(b){tOpen=true;tmin=+b.dataset.m;tl=tmin*60;tdone=false;if(tint){clearInterval(tint);tint=null}render(true)},
tgo(){tOpen=true;if(tint){clearInterval(tint);tint=null;return tuv()}if(tl<=0){tl=tmin*60;tdone=false}tint=setInterval(()=>{tl--;if(tl<=0){clearInterval(tint);tint=null;tl=0;tdone=true;log('Finished a '+tmin+' minute focus timer');persist();toast('Time is up.')}tuv()},1000);tuv()},
trs(){tOpen=true;clearInterval(tint);tint=null;tl=0;tdone=false;render(true)},
s5(){const t=cur();bump(t,5);log('Reviewed: '+t.title);return sv('Review saved')},
fin(){const t=cur();t.status='Completed';t.stage=5;log('Completed task: '+t.title);sv('Task marked complete')},
reopen(b){S.cur=b.dataset.i;pg=1;go('planner')},
askdel(b){delId=b.dataset.i;render(true)},cancel(){delId=null;wipeAsk=false;render(true)},
deltask(b){const t=S.tasks.find(x=>x.id===b.dataset.i);S.tasks=S.tasks.filter(x=>x.id!==b.dataset.i);if(S.cur===b.dataset.i)S.cur=null;delId=null;if(t)log('Deleted task: '+t.title);sv('Task deleted')},
aplay(){if(!canPlay())return;if(aSt==='paused'){aEl?aEl.play():speechSynthesis.resume();aSt='playing';aupd()}else if(aSt!=='playing')speak(aSt==='done'?0:aIdx)},
apause(){if(aSt==='playing'){aEl?aEl.pause():speechSynthesis.pause();aSt='paused';aupd()}},
astop(){if(!canPlay())return;stopAll();aSt='idle';aIdx=0;aupd()},arestart(){speak(0)},asec(b){speak(+b.dataset.i)},
aprev(){speak(Math.max(0,aIdx-1))},anext(){speak(Math.min(SC.length-1,aIdx+1))},dismiss(){recovered=false;render(true)},
exp(){const j=JSON.stringify({app:'ADHD Ease',version:3,exportedAt:new Date().toISOString(),...S},null,2);$('#dj').value=j;try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download='adhd-ease-data.json';document.body.appendChild(a);a.click();a.remove()}catch(e){}toast('Exported. Copy the text from the box if no file downloaded.')},
imp(){const v=$('#dj').value.trim();if(!v)return toast('Paste backup data into the box first.');impText(v)},
askwipe(){wipeAsk=true;render(true)},wipe(){S={tasks:[],cur:null,log:[],name:''};draft={};wipeAsk=false;persist();toast('All saved data deleted');render()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a],[data-go]');if(!b)return;if(b.dataset.go){if(b.dataset.stp)stp=+b.dataset.stp;if(b.dataset.pg)pg=+b.dataset.pg;go(b.dataset.go);return}
const ok=A[b.dataset.a](b);if(ok&&b.dataset.nx){stp=+b.dataset.nx;go('steps')}});
render();if(TTS)loadVoices();
</script></body></html>
